# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    # Keep the OS/Ruby ABI stable instead of following ubuntu-latest migrations.
    runs-on: ubuntu-22.04
    env:
      BUNDLE_RETRY: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure dependency mirror
        # Use the upstream registry from GitHub's runners without changing the
        # Gemfile/lockfile or any dependency version. Hidden files are not published.
        run: |
          mkdir -p .bundle
          printf '%s\n' '---' 'BUNDLE_MIRROR__HTTPS://GEMS__RUBY___CHINA__COM/: "https://rubygems.org/"' > .bundle/config
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.338.0
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.1.7'
          bundler: '2.5.6'
          bundler-cache: true # Restore compiled gems; install only on cache misses.
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore Jekyll conversion cache
        uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-${{ runner.os }}-${{ runner.arch }}-ruby-3.1.7-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ github.sha }}
          restore-keys: |
            jekyll-${{ runner.os }}-${{ runner.arch }}-ruby-3.1.7-${{ hashFiles('Gemfile.lock', '_config.yml') }}-
      - name: Build with Jekyll
        # Always do a full build: conversion caching is content-addressed, unlike
        # --incremental, which can leave stale indexes, feeds and pagination.
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  deploy-edgeone-pages:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout artifact
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: ./site
      - name: change
        shell: bash
        working-directory: ./site
        run: |
          tar -xvf artifact.tar
          rm -rf artifact.tar
      - name: Deploy to EdgeOne Pages
        uses: TencentEdgeOne/edgeone-pages-action@v1
        with:
          token: ${{ secrets.EDGEONE_API_TOKEN }}
          project-name: "xiaoshae-blog"
          build-path: "./site"
