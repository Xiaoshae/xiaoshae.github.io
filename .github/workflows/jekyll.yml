name: Ruby setup benchmark (no deployment)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Seed empty caches once, then measure warm replicas
        required: true
        type: choice
        options: [cold, warm]
      generation:
        description: Use a fresh identifier for cold runs, reuse it for warm runs
        required: true
        type: string

permissions:
  contents: read

env:
  BUNDLE_PATH: vendor/bundle
  BUNDLE_DEPLOYMENT: 'true'
  BUNDLE_FROZEN: 'true'
  BUNDLE_DISABLE_VERSION_CHECK: 'true'
  JEKYLL_ENV: production
  GITHUB_PAGES: 'true'

jobs:
  benchmark:
    name: ${{ inputs.phase }} / ${{ matrix.mode }} / ${{ matrix.replica }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [official, preinstalled, full]
        replica: ${{ fromJSON(inputs.phase == 'cold' && '[1]' || '[1,2,3]') }}
    steps:
      - name: Checkout identical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master
      - name: Configure identical locked dependencies
        run: |
          mkdir -p .bundle
          printf '%s\n' '---' 'BUNDLE_MIRROR__HTTPS://GEMS__RUBY___CHINA__COM/: "https://rubygems.org/"' > .bundle/config
      - name: Start complete setup timer
        run: echo "BENCHMARK_START_NS=$(date +%s%N)" >> "$GITHUB_ENV"
      - name: Official setup-ruby baseline
        if: matrix.mode == 'official'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0.9'
          rubygems: default
          bundler: '4.0.24'
          bundler-cache: true
          cache-version: ruby-benchmark-${{ inputs.generation }}
      - name: Custom setup including restore, verification and cold save
        if: matrix.mode != 'official'
        id: custom
        uses: ./.github/actions/setup-ruby-benchmark
        with:
          mode: ${{ matrix.mode }}
          phase: ${{ inputs.phase }}
          cache-key: ruby-benchmark-${{ inputs.generation }}-${{ matrix.mode }}-ubuntu-26.04-x64-ruby-4.0.9-rubygems-4.0.20-bundler-4.0.24-${{ hashFiles('Gemfile.lock', '.github/actions/setup-ruby-benchmark/action.yml') }}
      - name: Verify the same runtime and dependencies for every method
        run: |
          ruby -rbundler/setup -e 'abort "Unexpected toolchain" unless RUBY_VERSION == "4.0.9" && Gem::VERSION == "4.0.20" && Bundler::VERSION == "4.0.24"'
          echo "BENCHMARK_END_NS=$(date +%s%N)" >> "$GITHUB_ENV"
      - name: Build with the same clock and no conversion cache
        run: |
          rm -rf .jekyll-cache _site
          printf 'time: 2026-11-14 03:00:00 +0000\n' > "$RUNNER_TEMP/site-clock.yml"
          bundle exec jekyll build --baseurl '' --config "_config.yml,$RUNNER_TEMP/site-clock.yml"
      - name: Record complete setup time, sizes and output manifest
        env:
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_PHASE: ${{ inputs.phase }}
          BENCHMARK_REPLICA: ${{ matrix.replica }}
          BENCHMARK_CACHE_HIT: ${{ steps.custom.outputs.cache-hit }}
          BENCHMARK_RESULTS: ${{ runner.temp }}/ruby-benchmark-results
        run: bundle exec ruby .github/scripts/ruby-setup-benchmark.rb
      - name: Upload measurements (excluded from setup timing)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-benchmark-${{ inputs.phase }}-${{ matrix.mode }}-${{ matrix.replica }}
          path: ${{ runner.temp }}/ruby-benchmark-results
          retention-days: 7
          if-no-files-found: error
