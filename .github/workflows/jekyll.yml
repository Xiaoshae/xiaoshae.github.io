# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Version changes are reviewed and committed manually, never discovered at runtime.
env:
  BUNDLE_FROZEN: 'true'
  BUNDLE_DISABLE_VERSION_CHECK: 'true'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  # Build job
  build:
    # Keep the OS/Ruby ABI stable instead of following ubuntu-latest migrations.
    runs-on: ubuntu-26.04
    env:
      BUNDLE_RETRY: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master
      - name: Configure dependency mirror
        # Use the upstream registry from GitHub's runners without changing the
        # Gemfile/lockfile or any dependency version. Hidden files are not published.
        run: |
          mkdir -p .bundle
          printf '%s\n' '---' 'BUNDLE_MIRROR__HTTPS://GEMS__RUBY___CHINA__COM/: "https://rubygems.org/"' > .bundle/config
      - name: Setup complete Ruby environment
        # Ruby + Bundler + all locked gems share one exact, verified cache.
        uses: ./.github/actions/setup-ruby-environment
        with:
          cache-version: '1'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Restore Jekyll conversion cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jekyll-cache
          key: jekyll-ubuntu-26.04-${{ runner.arch }}-ruby-4.0.9-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ github.sha }}
          restore-keys: |
            jekyll-ubuntu-26.04-${{ runner.arch }}-ruby-4.0.9-${{ hashFiles('Gemfile.lock', '_config.yml') }}-
      - name: Build with Jekyll
        # Always do a full build: conversion caching is content-addressed, unlike
        # --incremental, which can leave stale indexes, feeds and pagination.
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Install lossless WebP encoder
        id: webp
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y webp
          version="$(cwebp -version)"
          echo "version=${version%%$'\n'*}" >> "$GITHUB_OUTPUT"
      - name: Setup image build environment
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Restore lossless article image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/article-webp
          key: article-webp-${{ runner.os }}-${{ runner.arch }}-${{ steps.webp.outputs.version }}-${{ hashFiles('.github/image-build/convert_images.py') }}-${{ github.sha }}
          restore-keys: |
            article-webp-${{ runner.os }}-${{ runner.arch }}-${{ steps.webp.outputs.version }}-${{ hashFiles('.github/image-build/convert_images.py') }}-
      - name: Test image build processing
        run: uv run --project .github/image-build --frozen python -m unittest discover -s .github/image-build -v
      - name: Convert article images to lossless WebP in parallel
        # Only deployment outputs change; source images and Markdown remain untouched.
        # The script defaults to one worker per CPU, capped at eight workers.
        run: |
          uv run --project .github/image-build --frozen python .github/image-build/convert_images.py \
            --site _site \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --site-url https://blog.xiaoshae.cn \
            --site-url https://xiaoshae.github.io
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # Deployment job
  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1


  deploy-esa-pages:
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout locked ESA deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/deploy-esa-pages
          persist-credentials: false
      - name: Download shared Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ./site
      - name: Extract static site
        working-directory: ./site
        run: |
          tar -xf artifact.tar
          rm artifact.tar
          test -f index.html
      - name: Deploy to Alibaba Cloud ESA Pages
        uses: ./.github/actions/deploy-esa-pages
        with:
          project: xiaoshae-blog
          path: ./site
          environment: production
          description: GitHub ${{ github.sha }}
        env:
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
