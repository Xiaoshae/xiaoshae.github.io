name: Deploy Zola site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Version changes are reviewed and committed manually, never discovered at runtime.
env:
  ZOLA_VERSION: '0.23.6'
  ZOLA_ARCHIVE_SHA256: '8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4'

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    # This runner is supported by Playwright's pinned Chromium dependencies.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      webp-delta-uploaded: ${{ steps.upload-webp-delta.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master
      - name: Build and verify site with Zola
        run: |
          archive="${RUNNER_TEMP}/zola.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" zola
          "$RUNNER_TEMP/zola" build
          test -f public/index.html
          test -f public/feed.xml
          grep -q 'Written-By-Human-Not-By-AI' public/blog/VXLAN/index.html
          grep -q 'Co-Created-With-AI' public/blog/linux-pxe-unattended-install-centos-rockylinux/index.html
          grep -q '<generator>Zola</generator>' public/feed.xml
      - name: Prepare article WebP images using the Git cache
        id: prepare-webp
        run: bash .github/image-build/build-with-git-cache.sh "${RUNNER_TEMP}/article-webp-delta"
      - name: Audit production artifact in Chromium
        run: |
          npm --prefix .github/site-audit ci
          npm --prefix .github/site-audit exec -- playwright install --with-deps --only-shell chromium
          npm --prefix .github/site-audit run audit -- "$GITHUB_WORKSPACE/public"
      - name: Upload new WebP cache files
        id: upload-webp-delta
        if: steps.prepare-webp.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: article-webp-delta
          path: ${{ runner.temp }}/article-webp-delta
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  update-image-cache:
    needs: build
    if: needs.build.outputs.webp-delta-uploaded == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout the build revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Download new WebP cache files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: article-webp-delta
          path: ${{ runner.temp }}/article-webp-delta
      - name: Publish WebP delta to image-cache
        run: bash .github/image-build/publish-git-cache.sh "${RUNNER_TEMP}/article-webp-delta"

  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-esa-pages:
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout locked ESA deployment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/deploy-esa-pages
          persist-credentials: false
      - name: Download shared Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ./site
      - name: Extract static site
        working-directory: ./site
        run: |
          tar -xf artifact.tar
          rm artifact.tar
          test -f index.html
      - name: Deploy to Alibaba Cloud ESA Pages
        uses: ./.github/actions/deploy-esa-pages
        with:
          project: xiaoshae-blog
          path: ./site
          environment: production
          description: GitHub ${{ github.sha }}
          not_found_strategy: 404Page
        env:
          ESA_ACCESS_KEY_ID: ${{ secrets.ESA_ACCESS_KEY_ID }}
          ESA_ACCESS_KEY_SECRET: ${{ secrets.ESA_ACCESS_KEY_SECRET }}
