name: Test and reproduce the article WebP tool

on:
  pull_request:
    paths:
      - '.github/image-build/**'
      - '.github/workflows/image-build-tests.yml'
  push:
    branches: [master]
    paths:
      - '.github/image-build/**'
      - '.github/workflows/image-build-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test, build and verify the pinned Linux amd64 executable
        run: |
          output="${RUNNER_TEMP}/article-webp"
          bash .github/image-build/build-tool.sh "$output"
          printf '%s  %s\n' "$(<.github/image-build/article-webp.sha256)" "$output" | sha256sum -c -
