name: Test article image processing

on:
  pull_request:
    paths:
      - '.github/image-build/**'
      - '.github/workflows/image-build-tests.yml'
  push:
    branches: [master]
    paths:
      - '.github/image-build/**'
      - '.github/workflows/image-build-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.3'
          enable-cache: false
      - name: Run image processing tests
        run: |
          bin="${RUNNER_TEMP}/webp-bin"
          bash .github/image-build/install-cwebp.sh "$bin"
          PATH="$bin:$PATH" uv run --project .github/image-build --frozen python -m unittest discover -s .github/image-build -v
