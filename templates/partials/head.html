<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>{% if page is defined %}{{ page.title }}{% elif section is defined %}{{ section.title }}{% elif term is defined %}{{ term.name }} - {{ config.title }}{% elif taxonomy is defined %}分类 - {{ config.title }}{% else %}页面未找到{% endif %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />

    <!-- Come and get me RSS readers -->
    <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ config.base_url }}/feed.xml" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ get_url(path='assets/css/style.css', cachebust=true) | replace(from=config.base_url, to='') }}">
    {% if page is defined %}
    <link rel="stylesheet" href="{{ get_url(path='assets/css/github-markdown.css', cachebust=true) | replace(from=config.base_url, to='') }}">
    <link rel="stylesheet" href="{{ get_url(path='assets/css/zola-syntax.css', cachebust=true) | replace(from=config.base_url, to='') }}">
    {% endif %}

    {% if page is defined %}
    <link rel="canonical" href="{{ page.permalink }}">
    {% elif paginator is defined and paginator.current_index > 1 %}
    <link rel="canonical" href="{{ paginator.base_url }}{{ paginator.current_index }}/">
    {% elif section is defined %}
    <link rel="canonical" href="{{ section.permalink }}">
    {% elif term is defined %}
    <link rel="canonical" href="{{ term.permalink }}">
    {% elif taxonomy is defined %}
    <link rel="canonical" href="{{ config.base_url }}/{{ taxonomy.name }}/">
    {% endif %}
</head>
