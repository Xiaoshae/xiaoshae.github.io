<!DOCTYPE html>
<html lang="{% if page is defined and page.extra.lang is defined and page.extra.lang != 'zh' %}{{ page.extra.lang }}{% else %}zh-CN{% endif %}">
{% include "partials/head.html" %}

<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  {% include "partials/header.html" %}

  <main id="main-content" class="content" tabindex="-1">
      <div class="markdown-body">
          {% block content %}{% endblock content %}
      </div>
  </main>

  {% include "partials/footer.html" %}
  <script type="speculationrules">
    {"prefetch":[{"where":{"and":[{"selector_matches":"a[data-prefetch]"},{"href_matches":"/blog/*"}]},"eagerness":"moderate"}]}
  </script>

</body>
</html>
